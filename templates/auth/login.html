<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    <main class="card shadow-sm mx-auto" style="width: min(24rem, calc(100% - 2rem));">
        <div class="card-body p-4">
            <h1 class="h4 mb-4">管理员登录</h1>
            {% if config_error %}
                <div class="alert alert-danger">管理员凭据尚未配置</div>
            {% elif error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            <form method="post" action="{{ url_for('auth.login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label" for="username">用户名</label>
                    <input class="form-control" id="username" name="username" autocomplete="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">密码</label>
                    <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">登录</button>
            </form>
        </div>
    </main>
</body>
</html>
