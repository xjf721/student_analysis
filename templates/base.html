<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}教学过程智能分析与预警平台{% endblock %}</title>
    
    <!-- AdminLTE -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        .content-wrapper {
            min-height: calc(100vh - 56px);
        }
        .card-primary .card-header {
            background-color: #007bff;
        }
        .small-box {
            border-radius: 0.5rem;
            box-shadow: 0 0 1px rgba(0,0,0,.125), 0 1px 3px rgba(0,0,0,.2);
        }
        .risk-high { color: #dc3545; }
        .risk-warning { color: #ffc107; }
        .risk-normal { color: #28a745; }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">
    <!-- Navbar -->
    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
            </li>
        </ul>
        
        <ul class="navbar-nav ml-auto">
            <li class="nav-item">
                <span class="nav-link">教学过程智能分析与预警平台</span>
            </li>
            {% if session.get('authenticated') %}
            <li class="nav-item">
                <form method="post" action="{{ url_for('auth.logout') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button class="btn btn-link nav-link" type="submit">退出</button>
                </form>
            </li>
            {% endif %}
        </ul>
    </nav>
    
    <!-- Main Sidebar -->
    <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <a href="/" class="brand-link">
            <span class="brand-text font-weight-light">教学分析系统</span>
        </a>
        
        <div class="sidebar">
            <nav class="mt-2">
                <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
                    <li class="nav-item">
                        <a href="/" class="nav-link {% if request.endpoint == 'dashboard.index' %}active{% endif %}">
                            <i class="nav-icon fas fa-tachometer-alt"></i>
                            <p>首页概览</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/students" class="nav-link {% if 'student' in request.endpoint %}active{% endif %}">
                            <i class="nav-icon fas fa-user-graduate"></i>
                            <p>学生画像</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/knowledge" class="nav-link {% if 'knowledge' in request.endpoint %}active{% endif %}">
                            <i class="nav-icon fas fa-brain"></i>
                            <p>知识点分析</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/warning" class="nav-link {% if 'warning' in request.endpoint %}active{% endif %}">
                            <i class="nav-icon fas fa-exclamation-triangle"></i>
                            <p>风险预警</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/import" class="nav-link {% if 'import' in request.endpoint %}active{% endif %}">
                            <i class="nav-icon fas fa-upload"></i>
                            <p>数据导入</p>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </aside>
    
    <!-- Content Wrapper -->
    <div class="content-wrapper">
        {% block content %}{% endblock %}
    </div>
    
    <!-- Footer -->
    <footer class="main-footer text-sm">
        <strong>教学过程智能分析与预警平台</strong>
    </footer>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script>
    $.ajaxSetup({
        headers: { 'X-CSRFToken': $('meta[name="csrf-token"]').attr('content') }
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
<!-- ECharts -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

{% block extra_js %}{% endblock %}
</body>
</html>
