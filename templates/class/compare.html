{% extends "base.html" %}
{% block title %}班级对比{% endblock %}
{% block content %}
<section class="content pt-3">
  <div class="container-fluid">
    <div class="card card-primary">
      <div class="card-header"><h3 class="card-title">班级对比</h3></div>
      <div class="card-body">
        <label for="class-compare-select">选择至少两个班级</label>
        <select id="class-compare-select" class="custom-select" multiple size="{{ [classes|length, 8]|min }}">
          {% for item in classes %}
          <option value="{{ item.id }}">{{ item.class_name }}{% if item.term %}（{{ item.term }}）{% endif %}（{{ '已归档' if item.status == 'archived' else '进行中' }}）</option>
          {% endfor %}
        </select>
        <button id="class-compare-submit" class="btn btn-primary mt-3" type="button">
          <i class="fas fa-chart-bar mr-1"></i>开始对比
        </button>
        <div id="class-compare-message" class="alert mt-3 d-none" role="alert"></div>
      </div>
    </div>

    <div class="row">
      <div class="col-12 col-xl-7">
        <div class="card">
          <div class="card-header"><h3 class="card-title">指标图表</h3></div>
          <div class="card-body">
            <div id="class-compare-chart" style="height: 420px" aria-label="班级指标对比图"></div>
          </div>
        </div>
      </div>
      <div class="col-12 col-xl-5">
        <div class="card">
          <div class="card-header"><h3 class="card-title">数值明细</h3></div>
          <div class="card-body table-responsive p-0">
            <table id="class-compare-table" class="table table-hover text-nowrap">
              <thead>
                <tr>
                  <th>班级</th><th>学生数</th><th>平均出勤率</th>
                  <th>平均实践成绩</th><th>平均掌握率</th>
                  <th>预警人数</th><th>预警率</th>
                </tr>
              </thead>
              <tbody><tr><td colspan="7" class="text-center text-muted">请选择班级进行对比</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
{% block extra_js %}
<script>
(function () {
  var select = document.getElementById('class-compare-select');
  var button = document.getElementById('class-compare-submit');
  var message = document.getElementById('class-compare-message');
  var tableBody = document.querySelector('#class-compare-table tbody');
  var chart = echarts.init(document.getElementById('class-compare-chart'));

  function showMessage(text, kind) {
    message.textContent = text;
    message.className = 'alert alert-' + kind + ' mt-3';
  }

  function displayMetric(value, suffix) {
    return value === null ? '—' : String(value) + (suffix || '');
  }

  function renderTable(rows) {
    tableBody.replaceChildren();
    rows.forEach(function (row) {
      var tr = document.createElement('tr');
      [
        row.class_label,
        row.student_count,
        displayMetric(row.avg_attendance_rate, '%'),
        displayMetric(row.avg_practice_score, ''),
        displayMetric(row.avg_mastery_rate, '%'),
        row.warning_count,
        displayMetric(row.warning_rate, '%')
      ].forEach(function (value) {
        var td = document.createElement('td');
        td.textContent = value;
        tr.appendChild(td);
      });
      tableBody.appendChild(tr);
    });
  }

  function renderChart(rows) {
    chart.setOption({
      tooltip: { trigger: 'axis', renderMode: 'richText' },
      legend: { top: 0 },
      grid: { left: 50, right: 25, top: 50, bottom: 70 },
      xAxis: {
        type: 'category',
        axisLabel: { interval: 0, rotate: rows.length > 3 ? 25 : 0 },
        data: rows.map(function (row) { return row.class_label; })
      },
      yAxis: { type: 'value', min: 0, max: 100, name: '百分比 / 分数' },
      series: [
        ['平均出勤率', 'avg_attendance_rate'],
        ['平均实践成绩', 'avg_practice_score'],
        ['平均掌握率', 'avg_mastery_rate'],
        ['预警率', 'warning_rate']
      ].map(function (metric) {
        return {
          name: metric[0],
          type: 'bar',
          data: rows.map(function (row) { return row[metric[1]]; })
        };
      })
    }, true);
  }

  button.addEventListener('click', function () {
    var selectedIds = Array.from(select.selectedOptions).map(function (option) {
      return option.value;
    });
    if (new Set(selectedIds).size < 2) {
      showMessage('请至少选择两个不同班级。', 'warning');
      return;
    }
    var query = new URLSearchParams();
    selectedIds.forEach(function (classId) { query.append('class_id', classId); });
    button.disabled = true;
    fetch('/api/classes/compare?' + query.toString(), { headers: { Accept: 'application/json' } })
      .then(function (response) {
        return response.json().then(function (data) {
          if (!response.ok) throw new Error(data.error || 'compare_failed');
          return data;
        });
      })
      .then(function (rows) {
        message.className = 'alert mt-3 d-none';
        renderTable(rows);
        renderChart(rows);
      })
      .catch(function () { showMessage('班级对比加载失败，请稍后重试。', 'danger'); })
      .finally(function () { button.disabled = false; });
  });

  window.addEventListener('resize', function () { chart.resize(); });
})();
</script>
{% endblock %}
