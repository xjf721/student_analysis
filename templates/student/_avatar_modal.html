<input class="avatar-local-upload d-none" type="file"
       accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
       aria-label="选择本地头像图片">

<div class="modal fade avatar-library-modal" tabindex="-1"
     aria-labelledby="avatar-library-title" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="avatar-library-title">从图像库选择</h5>
                <button type="button" class="close" data-dismiss="modal"
                        data-bs-dismiss="modal" aria-label="关闭">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="avatar-library-alert" aria-live="polite"></div>
                <div class="row avatar-library-grid">
                    <div class="col-12 py-5 text-center text-muted">正在加载图像……</div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal"
                        data-bs-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>
